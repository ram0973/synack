name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Включается переменной репозитория DEPLOY_ENABLED=true (Settings → Variables)
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Frontend
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - name: SSH setup
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key target/release/wiki \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/synack-wiki"

      - name: Restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            install -m 755 /tmp/synack-wiki /opt/synack/wiki
            rm -f /tmp/synack-wiki
            systemctl restart synack
            sleep 2
            systemctl is-active synack
            curl -fsS http://127.0.0.1:3000/health
          '
